name: Regenerate CONTEXT.md

on:
  schedule:
    - cron: "0 6 * * 1" # 08:00 Amsterdam time (CEST/UTC+2) every Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    uses: guidion-digital/context-layer/.github/workflows/regenerate-context.yaml@0.0.20
    with:
      tree_dirs: ".,.github,examples"
      repo_owner: "Cinfra"
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
